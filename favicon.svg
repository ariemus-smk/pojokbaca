    <!-- Book Center Spine -->
    <path d="M32 29.5 V45.5" stroke="#047857" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Page Lines (Accents) -->
    <path d="M16 38 C21 36.8 26 36.8 29.5 37.8" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M17 33.5 C21 32.5 25.5 32.5 28.5 33.3" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M48 38 C43 36.8 38 36.8 34.5 37.8" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M47 33.5 C43 32.5 38.5 32.5 35.5 33.3" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
