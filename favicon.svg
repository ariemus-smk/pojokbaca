<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  
  <g filter="url(#shadow)">
    <!-- Reader Head -->
    <circle cx="32" cy="17" r="5" fill="#ffffff"/>
    
    <!-- Reader Shoulders -->
    <path d="M23 27 C24 23.5 28 23 32 23 C36 23 40 23.5 41 27 C37 28 27 28 23 27 Z" fill="#ffffff"/>
    
